apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backend
  namespace: powercortex-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi-backend
  template:
    metadata:
      labels:
        app: fastapi-backend
    spec:
      containers:
      - name: fastapi
        image: powercortex-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: powercortex-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: powercortex-secrets
              key: JWT_SECRET
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-backend
  namespace: powercortex-prod
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: fastapi-backend
