name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pytest

    - name: Run Bandit Security Scan
      run: |
        bandit -r app -s B104,B105,B110,B301,B403
        
    - name: Test ML Signature Generator
      run: |
        python ../generate_model_hashes.py

    - name: Run Pytest Suite
      env:
        MONGODB_URL: mongodb://127.0.0.1:27017
        DATABASE_NAME: powercortex_test_db
        JWT_SECRET_KEY: test_secret_key_123_test_secret_key_123
        JWT_REFRESH_SECRET: test_refresh_key_123_test_refresh_key_123
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30
      run: |
        pytest tests/
